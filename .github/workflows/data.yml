name: Refresh Microsoft lists

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-data
      - name: Commit if changed, rebuild and redeploy the site
        run: |
          if git diff --quiet -- data; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run build
          git add data dist/cli
          git commit -m "Refresh Microsoft extension lists"
          git push
          npm run deploy
